site_name: Revex
site_description: "Hybrid retrieval for teams. Vector, keyword, graph, memory, web — one engine."
site_url: https://sachncs.github.io/revex/
repo_url: https://github.com/sachncs/revex
repo_name: sachncs/revex
edit_uri: blob/master/docs
docs_dir: docs
copyright: "Released under the MIT License."

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Installation: install.md
  - Architecture:
      - Overview: architecture/overview.md
      - Data flow: architecture/data-flow.md
      - Tenancy and encryption: architecture/tenancy.md
  - Guide:
      - Workspaces: guide/workspace.md
      - Onboarding: guide/onboarding.md
      - RBAC & ACL: guide/rbac-acl.md
      - Ingestion: guide/ingestion.md
      - Retrieval & reranking: guide/retrieval.md
      - Orchestrator & agents: guide/orchestration.md
      - Embedders & LLM: guide/llm-embedding.md
      - Workers & jobs: guide/workers-jobs.md
      - Telemetry: guide/telemetry.md
      - Web console: guide/web.md
      - Evaluation: guide/eval.md
      - Development: guide/development.md
  - Configuration: configuration.md
  - Examples:
      - Overview: examples/index.md
      - Minimal retrieval: examples/minimal-retrieval.md
      - Encrypted workspace: examples/encrypted-workspace.md
      - Custom plugin: examples/custom-plugin.md
  - Reference:
      - HTTP API: reference/api.md
      - CLI: reference/cli.md
      - Error codes: reference/errors.md
  - Operations:
      - Deployment: operations/deployment.md
      - Security hardening: operations/security.md
      - Troubleshooting: troubleshooting.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.keys

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: ignore
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
    anchors: ignore
