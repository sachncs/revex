    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181f" media="(prefers-color-scheme: dark)" />

    <title>Revex — Hybrid retrieval for teams</title>
    <meta
      name="description"
      content="Revex is a hybrid retrieval engine for teams. Vector, keyword, graph, memory, and web — fused behind one policy-aware engine. Self-host or cloud."
    />

      name="keywords"
      content="hybrid retrieval, RAG, vector search, BM25, GraphRAG, retrieval augmented generation, enterprise AI, policy-aware retrieval, Revex"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Revex" />
    <meta property="og:title" content="Revex — Hybrid retrieval for teams" />

      property="og:description"

    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('revex-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
