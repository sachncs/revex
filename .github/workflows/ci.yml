name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Rebuild native modules
        run: pnpm rebuild -r better-sqlite3 @sqlite.org/sqlite-vec

  gates:
    name: ${{ matrix.task }}
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Rebuild native modules
        run: pnpm rebuild -r better-sqlite3 @sqlite.org/sqlite-vec
      - name: ${{ matrix.task }}
        run: pnpm turbo run ${{ matrix.task }}

  docs-build:
    name: Docs build (mkdocs --strict)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mkdocs-material
        run: pip install --quiet mkdocs-material mkdocs-material[imaging]
      - name: Build docs site (strict)
        run: mkdocs build --strict
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
